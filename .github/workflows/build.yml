name: macOS build and calculation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Universal app and run calculation tests
        run: bash Scripts/build.sh
      - name: Show calculation report
        run: cat Verification/calculation-tests.json
